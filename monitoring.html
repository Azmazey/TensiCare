<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Monitoring Pasien</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f3f3f3}
.container{max-width:1100px;margin:auto;padding:30px 20px}
.header{background:#cfe7e1;border-radius:24px;padding:26px 28px 42px;margin-bottom:28px;position:relative}
.back-btn{position:absolute;top:22px;left:24px;font-size:24px;text-decoration:none;color:#128F8B;font-weight:bold}
.header-title{text-align:center;font-weight:600;font-size:19px;margin-bottom:22px}
.summary-card{background:#fff;border-radius:24px;padding:24px;max-width:560px;margin:0 auto 16px}
.summary-content{display:flex;align-items:center;gap:18px}
.icon-wrap{width:84px;height:84px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.icon-img{width:58px}
.summary-text strong{font-size:18px;display:block}
.summary-text small{font-size:14px;color:#6a8f86}
.detail-wrap{text-align:center}
.detail-btn{background:#6ec6c3;color:#fff;padding:10px 22px;border-radius:18px;text-decoration:none;font-weight:bold}
.main-btn{display:block;margin:26px auto 28px;background:#1c9c8c;color:#fff;padding:14px 38px;border-radius:22px;border:none;font-weight:bold}
.list-card{background:#fff;border-radius:26px;padding:26px}
.patient{display:flex;justify-content:space-between;align-items:center;border:1px solid #e5e5e5;border-radius:16px;padding:14px 18px;margin-bottom:14px}
.patient-left{display:flex;align-items:center;gap:12px}
.avatar-img {width:38px;height:38px;border-radius:50%;object-fit:cover}
.status{width:92px;text-align:center;font-size:13px;padding:6px 0;border-radius:14px;font-weight:bold;display:inline-block}
.normal{background:#2dbb54;color:#fff}
.warning{background:#f4d03f;color:#000}
.arrow-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin-left:10px;border-radius:8px;background:#eee;color:#555;text-decoration:none;font-size:16px;font-weight:bold}
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px}
.page-btn{padding:6px 14px;border-radius:12px;background:#e0e0e0;cursor:pointer;font-size:13px}
.page-btn.active{background:#1c9c8c;color:#fff}
.page-arrow{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;user-select:none}
.page-arrow.enabled{color:#000;cursor:pointer}
.page-arrow.disabled{color:#aaa;cursor:default}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="loginnakes.html" class="back-btn">‹</a>
    <div class="header-title">Monitoring Pasien</div>
    <div class="summary-card">
      <div class="summary-content">
        <div class="icon-wrap"><img src="icon-ibu.png" class="icon-img"></div>
        <div class="summary-text">
          <strong>Ibu hamil terpantau</strong>
          <small id="summaryText"></small>
        </div>
      </div>
    </div>
  </div>

  <button class="main-btn">Daftar Ibu Hamil</button>

  <div class="list-card" id="patientList"></div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
let patients=[
 {name:"Sulastri",status:"warning"},
 {name:"Luna Maya",status:"normal"},
 {name:"Rina",status:"normal"},
 {name:"Dewi",status:"normal"},
 {name:"Ani",status:"warning"},
 {name:"Maya",status:"normal"},
 {name:"Sinta",status:"normal"}
];

// Sort waspada di atas
patients.sort((a,b)=> (a.status==="warning"?0:1) - (b.status==="warning"?0:1));

const perPage=5;
let currentPage=1;

function render(){
 const start=(currentPage-1)*perPage;
 const data=patients.slice(start,start+perPage);
 const list=document.getElementById("patientList");
 list.innerHTML="";
 data.forEach(p=>{
   list.innerHTML+=`
    <div class="patient">
      <div class="patient-left">
        <img src="profil-ibu.png" class="avatar-img">
        <span>${p.name}</span>
      </div>
      <div>
        <span class="status ${p.status}">${p.status==="normal"?"Normal":"Waspada"}</span>
        <a href="detail.html?name=${encodeURIComponent(p.name)}" class="arrow-btn">›</a>
      </div>
    </div>
   `;
 });

 document.getElementById("summaryText").innerText=
  `${patients.length} total, ${patients.filter(p=>p.status==="warning").length} waspada`;

 renderPagination();
}

function renderPagination(){
 const total=Math.ceil(patients.length/perPage);
 const pag=document.getElementById("pagination");
 pag.innerHTML="";

 pag.innerHTML+=`<div class="page-arrow ${currentPage>1?'enabled':'disabled'}" ${currentPage>1?`onclick="goPage(${currentPage-1})"`:""}>‹</div>`;

 for(let i=1;i<=total;i++){
   pag.innerHTML+=`<div class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</div>`;
 }

 pag.innerHTML+=`<div class="page-arrow ${currentPage<total?'enabled':'disabled'}" ${currentPage<total?`onclick="goPage(${currentPage+1})"`:""}>›</div>`;
}

function goPage(p){currentPage=p;render();}
render();
</script>
</body>
</html>
