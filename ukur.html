<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Sedang Mengukur</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background-color: #FFF6F1;
    font-family: Arial, sans-serif;
}

/* CONTAINER */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px;
    text-align: center;
}

/* HEADER (SAMA DENGAN DASHBOARD) */
.header {
    background-color: #FFDCC5;
    border-radius: 20px;
    padding: 20px 24px;
    margin-bottom: 24px;
    position: relative;
}

/* BACK BUTTON */
.back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 22px;
    text-decoration: none;
    color: #FF8A3D;
    font-weight: bold;
}

/* GREETING */
.greeting {
    background: white;
    border-radius: 16px;
    padding: 16px 18px;
    font-size: 14px;
    color: #FF8A3D;
    margin-left: 40px;
    text-align: left;
}

/* STATUS ALAT */
.status-alat {
    background: #E6F5EF;
    color: #1AA59A;
    padding: 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    width: fit-content;
    margin: 0 auto 30px;
}

/* TITLE */
.title {
    font-size: 22px;
    font-weight: bold;
    color: #FFA467;
    margin-bottom: 30px;
}

/* LOADER */
.loader {
    margin: auto;
    width: 140px;
    height: 140px;
    border: 12px solid #FFE0CC;
    border-top: 12px solid #FFA467;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    100% {
        transform: rotate(360deg);
    }
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .container {
        padding: 20px 16px;
    }

    .loader {
        width: 110px;
        height: 110px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <a href="dashboard.html" class="back-btn">‹</a>

        <div class="greeting">
            <strong>Halo, Bu Sulastri</strong><br>
            Pantau tekanan darah Anda secara mandiri
        </div>
    </div>

    <div class="status-alat">
        Status Alat: Terhubung
    </div>

    <div class="title">
        Sedang Mengukur
    </div>

    <div class="loader"></div>

</div>
<script>
    // simulasi waktu pengukuran (misal 4 detik)
    setTimeout(function () {
        window.location.href = "hasil.html";
    }, 4000);
</script>

</body>
</html>
