<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Hasil Pengukuran</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background-color: #FFF6F1;
    font-family: Arial, sans-serif;
}

/* CONTAINER */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px;
    text-align: center;
}

/* HEADER */
.header {
    background-color: #FFDCC5;
    border-radius: 20px;
    padding: 20px 24px;
    margin-bottom: 20px;
    position: relative;
}

.back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 22px;
    text-decoration: none;
    color: #FF8A3D;
    font-weight: bold;
}

.greeting {
    background: white;
    border-radius: 16px;
    padding: 16px 18px;
    font-size: 14px;
    color: #FF8A3D;
    margin-left: 40px;
    text-align: left;
}

/* STATUS ALAT */
.status-alat {
    padding: 12px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    width: fit-content;
    margin: 0 auto 30px;
}

.connected {
    background: #E6F5EF;
    color: #1AA59A;
}

.disconnected {
    background: #FDECEC;
    color: #E53935;
}

/* TITLE */
.title {
    font-size: 22px;
    font-weight: bold;
    color: #FFA467;
    margin-bottom: 20px;
}

/* CARD */
.card {
    background: white;
    border-radius: 22px;
    padding: 32px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    max-width: 520px;
    margin: auto;
}

.value {
    font-size: 40px;
    font-weight: bold;
}

.value small {
    font-size: 16px;
    color: #777;
}

.status {
    display: inline-block;
    padding: 8px 22px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    margin: 12px 0;
}

.normal { background: #2ECC71; color: white; }
.warning { background: #F1C40F; color: white; }
.danger  { background: #E53935; color: white; }

.desc {
    font-size: 14px;
    color: #555;
}

/* BUTTON */
.button {
    display: inline-block;
    margin-top: 30px;
    background: #FFA467;
    color: white;
    padding: 14px 42px;
    border-radius: 22px;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .value { font-size: 32px; }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <a href="dashboard.html" class="back-btn">‹</a>
        <div class="greeting">
            <strong>Halo, Bu Sulastri</strong><br>
            Pantau tekanan darah Anda secara mandiri
        </div>
    </div>

    <!-- STATUS ALAT -->
    <div class="status-alat connected">
        Status Alat: Terhubung
    </div>

    <!-- TITLE -->
    <div class="title">Hasil Pengukuran</div>

    <!-- CARD -->
    <div class="card">
        <div class="value">
            118 / 80 <small>mmHg</small>
        </div>

        <!-- ganti class: normal / warning / danger -->
        <div class="status normal">Normal</div>

        <div class="desc">
            Tekanan darah Anda berada dalam batas normal.
        </div>
    </div>

    <a href="dashboard.html" class="button">Selesai</a>

</div>

</body>
</html>
