<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>TensiCare</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background-color: #FFF6F1;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.container {
  text-align: center;
  animation: fadeIn 0.8s ease;
}

/* LOGO */
.logo-circle {
  width: 130px;
  height: 130px;
  background-color: #FFF1E8;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0 auto 24px;
}

.logo-circle img {
  max-width: 240px;
  height: auto;
}

/* TEXT */
h1 {
  margin: 0;
  color: #1AA59A;
  font-size: 26px;
}

p {
  margin-top: 8px;
  color: #1AA59A;
  font-size: 14px;
  line-height: 1.4;
}

/* LOADER */
.loader {
  margin: 26px auto 0;
  width: 36px;
  height: 36px;
  border: 4px solid #E3F2EF;
  border-top: 4px solid #1AA59A;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

/* ANIMATIONS */
@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">
  <div class="logo-circle">
    <img src="logo.png" alt="Logo TensiCare">
  </div>

  <h1>TensiCare</h1>
  <p>
    Pantau tekanan darah ibu hamil<br>
    dengan aman
  </p>

  <div class="loader"></div>
</div>

<script>
/* PINDAH KE ROLE */
setTimeout(() => {
  window.location.href = "role.html";
}, 2500);
</script>

</body>
</html>
